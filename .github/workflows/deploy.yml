name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wait for deployed Pages site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Target URL: $url"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
            echo "Attempt $i: $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Page did not become available"
          exit 1
      - name: Run OWASP ZAP DAST scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/zap/wrk" owasp/zap2docker-stable zap-baseline.py -t "${{ steps.deployment.outputs.page_url }}" -r zap-report.html
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
